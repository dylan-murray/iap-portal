name: build-base-images

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Container registry hostname
        default: ghcr.io
        required: true
      image-prefix:
        description: Full lowercase image prefix, e.g. ghcr.io/your-org/iap-base
        required: true

permissions:
  contents: read
  packages: write

jobs:
  python:
    if: ${{ github.ref == 'refs/heads/main' && !github.event.repository.private }}
    environment: release
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: base-images/python/Dockerfile
          push: true
          tags: ${{ inputs.image-prefix }}/python:${{ github.sha }}
  frameworks:
    needs: python
    if: ${{ github.ref == 'refs/heads/main' && !github.event.repository.private }}
    environment: release
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      matrix:
        framework: [streamlit, fastapi, flask, gradio]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: base-images/${{ matrix.framework }}/Dockerfile
          push: true
          build-args: BASE=${{ inputs.image-prefix }}/python:${{ github.sha }}
          tags: ${{ inputs.image-prefix }}/${{ matrix.framework }}:${{ github.sha }}
  cuda:
    if: ${{ github.ref == 'refs/heads/main' && !github.event.repository.private }}
    environment: release
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: base-images/cuda-pytorch/Dockerfile
          push: true
          tags: ${{ inputs.image-prefix }}/cuda-pytorch:${{ github.sha }}
