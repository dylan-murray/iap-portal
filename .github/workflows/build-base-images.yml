name: build-base-images

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Container registry hostname
        default: ghcr.io
        required: true
      image-prefix:
        description: Full lowercase image prefix, e.g. ghcr.io/your-org/iap-base
        required: true

permissions:
  contents: read
  packages: write

jobs:
  python:
    if: ${{ github.ref == 'refs/heads/main' && !github.event.repository.private }}
    environment: release
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: base-images/python/Dockerfile
          push: true
          tags: ${{ inputs.image-prefix }}/python:${{ github.sha }}
  frameworks:
    needs: python
    if: ${{ github.ref == 'refs/heads/main' && !github.event.repository.private }}
    environment: release
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      matrix:
        framework: [streamlit, fastapi, flask, gradio]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: base-images/${{ matrix.framework }}/Dockerfile
          push: true
          build-args: BASE=${{ inputs.image-prefix }}/python:${{ github.sha }}
          tags: ${{ inputs.image-prefix }}/${{ matrix.framework }}:${{ github.sha }}
  cuda:
    if: ${{ github.ref == 'refs/heads/main' && !github.event.repository.private }}
    environment: release
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: base-images/cuda-pytorch/Dockerfile
          push: true
          tags: ${{ inputs.image-prefix }}/cuda-pytorch:${{ github.sha }}
