name: build-base-images

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Container registry hostname
        default: ghcr.io
        required: true
      image-prefix:
        description: Full lowercase image prefix, e.g. ghcr.io/your-org/iap-base
        required: true

permissions:
  contents: read
  packages: write

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: base-images/python/Dockerfile
          push: true
          tags: ${{ inputs.image-prefix }}/python:${{ github.sha }}
  frameworks:
    needs: python
    runs-on: ubuntu-latest
    strategy:
      matrix:
        framework: [streamlit, fastapi, flask, gradio]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: base-images/${{ matrix.framework }}/Dockerfile
          push: true
          build-args: BASE=${{ inputs.image-prefix }}/python:${{ github.sha }}
          tags: ${{ inputs.image-prefix }}/${{ matrix.framework }}:${{ github.sha }}
  cuda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: base-images/cuda-pytorch/Dockerfile
          push: true
          tags: ${{ inputs.image-prefix }}/cuda-pytorch:${{ github.sha }}
