name: publish-release

# Publication is deliberately manual and unavailable while the repo is private.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version matching source metadata and an existing vX.Y.Z tag
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: ${{ !github.event.repository.private }}
    environment: release
    timeout-minutes: 45
    runs-on: ubuntu-latest
    concurrency: release-publication
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected X.Y.Z"; exit 1; }
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "CHART_REGISTRY=oci://ghcr.io/${GITHUB_REPOSITORY,,}/charts" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: v${{ inputs.version }}
      - name: Require release tag on main
        run: |
          test "$GITHUB_REF" = refs/heads/main
          git merge-base --is-ancestor HEAD origin/main
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: uv sync --all-extras --locked
      - name: Check release metadata and tests
        run: |
          uv run python - <<'PY'
          import os, pathlib, tomllib, yaml
          version = os.environ['VERSION']
          for path in ('pyproject.toml', 'backend/pyproject.toml', 'sdk/pyproject.toml'):
              assert tomllib.loads(pathlib.Path(path).read_text())['project']['version'] == version, path
          for path in ('charts/iap-app/Chart.yaml', 'deploy/platform/portal-chart/Chart.yaml'):
              assert yaml.safe_load(pathlib.Path(path).read_text())['version'] == version, path
          PY
          uv run pytest backend/tests sdk/tests tests -q
          bash scripts/package-charts.sh dist/charts
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ inputs.version }}
      - name: Publish versioned Helm charts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/charts/iap-portal-${VERSION}.tgz" "$CHART_REGISTRY"
          helm push "dist/charts/iap-app-${VERSION}.tgz" "$CHART_REGISTRY"
