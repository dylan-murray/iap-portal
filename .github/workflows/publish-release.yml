name: publish-release

# Publication is deliberately manual and unavailable while the repo is private.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version matching source metadata and an existing vX.Y.Z tag
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected X.Y.Z"; exit 1; }
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "CHART_REGISTRY=oci://ghcr.io/${GITHUB_REPOSITORY,,}/charts" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
      - uses: astral-sh/setup-uv@v6
      - uses: azure/setup-helm@v4
      - run: uv sync --all-extras --locked
      - name: Check release metadata and tests
        run: |
          uv run python - <<'PY'
          import os, pathlib, tomllib, yaml
          version = os.environ['VERSION']
          for path in ('pyproject.toml', 'backend/pyproject.toml', 'sdk/pyproject.toml'):
              assert tomllib.loads(pathlib.Path(path).read_text())['project']['version'] == version, path
          for path in ('charts/iap-app/Chart.yaml', 'deploy/platform/portal-chart/Chart.yaml'):
              assert yaml.safe_load(pathlib.Path(path).read_text())['version'] == version, path
          PY
          uv run pytest backend/tests sdk/tests tests -q
          bash scripts/package-charts.sh dist/charts
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ inputs.version }}
      - name: Publish versioned Helm charts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/charts/iap-portal-${VERSION}.tgz" "$CHART_REGISTRY"
          helm push "dist/charts/iap-app-${VERSION}.tgz" "$CHART_REGISTRY"
