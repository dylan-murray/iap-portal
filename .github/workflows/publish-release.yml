name: publish-release

# Publication is deliberately manual and unavailable while the repo is private.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version matching source metadata and an existing vX.Y.Z tag
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: ${{ !github.event.repository.private }}
    environment: release
    timeout-minutes: 45
    runs-on: ubuntu-latest
    concurrency: release-publication
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected X.Y.Z"; exit 1; }
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "CHART_REGISTRY=oci://ghcr.io/${GITHUB_REPOSITORY,,}/charts" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: v${{ inputs.version }}
      - name: Require release tag on main
        run: |
          test "$GITHUB_REF" = refs/heads/main
          git merge-base --is-ancestor HEAD origin/main
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - run: uv sync --all-extras --locked
      - name: Check release metadata and tests
        run: |
          uv run python - <<'PY'
          import os, pathlib, tomllib, yaml
          version = os.environ['VERSION']
          for path in ('pyproject.toml', 'backend/pyproject.toml', 'sdk/pyproject.toml'):
              assert tomllib.loads(pathlib.Path(path).read_text())['project']['version'] == version, path
          for path in ('charts/iap-app/Chart.yaml', 'deploy/platform/portal-chart/Chart.yaml'):
              assert yaml.safe_load(pathlib.Path(path).read_text())['version'] == version, path
          PY
          uv run pytest backend/tests sdk/tests tests -q
          bash scripts/package-charts.sh dist/charts
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ inputs.version }}
      - name: Publish versioned Helm charts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/charts/iap-portal-${VERSION}.tgz" "$CHART_REGISTRY"
          helm push "dist/charts/iap-app-${VERSION}.tgz" "$CHART_REGISTRY"
