name: deploy-iap-app

on:
  workflow_call:
    inputs:
      app-slug:
        type: string
        required: true
      platform-repository:
        description: Repository containing IAP Portal and charts/iap-app
        type: string
        required: true
      platform-ref:
        type: string
        default: main
      registry:
        type: string
        default: ghcr.io
      image-repository:
        description: Full image repository without tag
        type: string
        required: true
      base-image:
        description: Published framework base image built from this platform checkout
        type: string
        required: true
      helm-values-file:
        type: string
        default: iap-app.yaml
      runner:
        description: JSON runner labels; use self-hosted labels for private clusters
        type: string
        default: '["ubuntu-latest"]'
    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true
      KUBECONFIG:
        description: Raw kubeconfig with permission to deploy in the prepared app namespace
        required: true

permissions:
  contents: read

jobs:
  deploy:
    timeout-minutes: 30
    runs-on: ${{ fromJSON(inputs.runner) }}
    env:
      APP_SLUG: ${{ inputs.app-slug }}
      IMAGE_REPOSITORY: ${{ inputs.image-repository }}
      VALUES_FILE: ${{ inputs.helm-values-file }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ inputs.platform-repository }}
          ref: ${{ inputs.platform-ref }}
          path: .iap-platform
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          build-args: BASE_IMAGE=${{ inputs.base-image }}
          tags: ${{ inputs.image-repository }}:${{ github.sha }}
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
      - name: Deploy to prepared namespace
        env:
          KUBE_CONFIG: ${{ secrets.KUBECONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          export KUBECONFIG="$RUNNER_TEMP/iap-kubeconfig"
          trap 'rm -f "$KUBECONFIG"' EXIT
          umask 077
          printf '%s' "$KUBE_CONFIG" > "$KUBECONFIG"
          helm upgrade --install "$APP_SLUG" .iap-platform/charts/iap-app \
            --namespace "iap-app-$APP_SLUG" \
            --values "$VALUES_FILE" \
            --set-string slug="$APP_SLUG" \
            --set-string image.repository="$IMAGE_REPOSITORY" \
            --set-string image.tag="$GITHUB_SHA" \
            --wait --timeout 10m
