name: deploy-iap-app

on:
  workflow_call:
    inputs:
      app-slug:
        type: string
        required: true
      platform-repository:
        description: Repository containing IAP Portal and charts/iap-app
        type: string
        required: true
      platform-ref:
        type: string
        default: main
      registry:
        type: string
        default: ghcr.io
      image-repository:
        description: Full image repository without tag
        type: string
        required: true
      base-image:
        description: Published framework base image built from this platform checkout
        type: string
        required: true
      helm-values-file:
        type: string
        default: iap-app.yaml
      runner:
        description: JSON runner labels; use self-hosted labels for private clusters
        type: string
        default: '["ubuntu-latest"]'
    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true
      KUBECONFIG:
        description: Raw kubeconfig with permission to deploy in the prepared app namespace
        required: true

permissions:
  contents: read

jobs:
  deploy:
    timeout-minutes: 30
    runs-on: ${{ fromJSON(inputs.runner) }}
    env:
      APP_SLUG: ${{ inputs.app-slug }}
      IMAGE_REPOSITORY: ${{ inputs.image-repository }}
      VALUES_FILE: ${{ inputs.helm-values-file }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.platform-repository }}
          ref: ${{ inputs.platform-ref }}
          path: .iap-platform
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: BASE_IMAGE=${{ inputs.base-image }}
          tags: ${{ inputs.image-repository }}:${{ github.sha }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      - name: Deploy to prepared namespace
        env:
          KUBE_CONFIG: ${{ secrets.KUBECONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          export KUBECONFIG="$RUNNER_TEMP/iap-kubeconfig"
          trap 'rm -f "$KUBECONFIG"' EXIT
          umask 077
          printf '%s' "$KUBE_CONFIG" > "$KUBECONFIG"
          helm upgrade --install "$APP_SLUG" .iap-platform/charts/iap-app \
            --namespace "iap-app-$APP_SLUG" \
            --values "$VALUES_FILE" \
            --set-string slug="$APP_SLUG" \
            --set-string image.repository="$IMAGE_REPOSITORY" \
            --set-string image.tag="$GITHUB_SHA" \
            --wait --timeout 10m
