apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.slug }}
  namespace: {{ include "iap-app.namespace" . }}
  labels:
    {{- include "iap-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP                       # never publicly exposed — gateway is the only door
  selector:
    app: {{ .Values.slug }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
