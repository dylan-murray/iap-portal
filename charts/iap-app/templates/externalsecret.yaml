{{- if .Values.secrets.external.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: {{ include "iap-app.namespace" . }}
spec:
  refreshInterval: {{ .Values.secrets.external.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.secrets.external.storeRef.kind }}
    name: {{ required "secrets.external.storeRef.name is required" .Values.secrets.external.storeRef.name }}
  target:
    name: {{ .Values.secrets.existingSecret | default "app-secrets" | quote }}
    creationPolicy: Owner
  {{- with .Values.secrets.external.data }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.secrets.external.dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
