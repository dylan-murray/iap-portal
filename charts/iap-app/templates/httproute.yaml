apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.slug }}
  namespace: {{ include "iap-app.namespace" . }}
  labels:
    {{- include "iap-app.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName | default "https" }}
  hostnames:
    - {{ include "iap-app.fqdn" . | quote }}
  rules:
    - backendRefs:
        - name: {{ .Values.slug }}
          port: {{ .Values.port }}
