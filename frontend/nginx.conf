server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — non-asset paths resolve to index.html
  location / {
    try_files $uri /index.html;
  }

  # API calls are handled by the FastAPI backend — the portal pod runs both
  # side-by-side behind a single Service in prod, but at the k8s layer these are
  # routed to the `portal` upstream directly.
}
