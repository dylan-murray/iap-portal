# Development-only Compose stack, built from IAP_PORTAL_SOURCE.
services:
  db:
    networks: [default, authorization-db]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    volumes:
    - portal-db:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -U
      - portal
      interval: 2s
  mock-idp:
    build: ${IAP_PORTAL_SOURCE:?Set IAP_PORTAL_SOURCE to the platform checkout}/dev/mock-idp
    ports:
    - 127.0.0.1:8081:8081
    environment:
      MOCK_IDP_ISSUER: http://mock-idp.iapportal.test:8081
    command:
    - uvicorn
    - main:app
    - --host
    - 0.0.0.0
    - --port
    - '8081'
    networks:
      default:
        aliases:
        - mock-idp.iapportal.test
  portal:
    build:
      context: ${IAP_PORTAL_SOURCE:?Set IAP_PORTAL_SOURCE to the platform checkout}
      dockerfile: backend/Dockerfile
    environment:
      PORTAL_ENV: dev
      PORTAL_PORTAL_BASE_URL: http://portal.iapportal.test:8090
      PORTAL_DATABASE_URL: postgresql+asyncpg://portal:portal@db/portal
      PORTAL_SESSION_SECRET: dev-secret-change-me-to-something-32chars
      PORTAL_OIDC_ISSUER: http://mock-idp.iapportal.test:8081
      PORTAL_OIDC_CLIENT_ID: portal-local
      PORTAL_OIDC_CLIENT_SECRET: secret
      PORTAL_ADMIN_EMAILS: alice@example.com
      PORTAL_ADMIN_API_TOKEN: dev-admin-token-change-me-in-prod
      PORTAL_JWT_PRIVATE_KEY_PEM_FILE: /app/.dev-keys/private.pem
      PORTAL_JWT_PUBLIC_KEY_PEM_FILE: /app/.dev-keys/public.pem
    volumes:
    - ${IAP_PORTAL_SOURCE}/backend/.dev-keys:/app/.dev-keys:ro
    depends_on:
      db:
        condition: service_healthy
      mock-idp:
        condition: service_started
  authorization:
    extends:
      service: portal
    command: [uvicorn, "iap_portal_server.main:create_authorization_app", "--factory", "--host", "0.0.0.0", "--port", "8091"]
    networks: [authorization, authorization-db]

  envoy:
    networks: [default, authorization]
    image: envoyproxy/envoy:v1.31-latest
    command:
    - -c
    - /etc/envoy/envoy.yaml
    volumes:
    - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
    - 127.0.0.1:8090:8090
    depends_on:
    - portal
    - authorization
  user-app:
    build: ${IAP_PORTAL_DEV_APP_PATH:?Set the application source path}
    environment:
      PORT: '8080'
      IAP_PORTAL_APP_SLUG: ${IAP_PORTAL_DEV_APP_SLUG:?Set the application slug}
      IAP_PORTAL_ISSUER: http://portal.iapportal.test:8090
      IAP_PORTAL_JWKS_URL: http://portal:8090/.well-known/jwks.json
      IAP_PORTAL_VERIFY_JWT: 'true'
volumes:
  portal-db: null

# Only Envoy and the authorization service share the authorization network.
# Database connectivity uses a separate network without app or gateway members.
networks:
  authorization:
    internal: true
  authorization-db:
    internal: true
