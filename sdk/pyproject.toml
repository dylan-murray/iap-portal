[project]
name = "iap-portal"
version = "0.1.0"
license = "Apache-2.0"
description = "SDK + CLI for the IAP Portal for internal apps"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pyjwt[crypto]>=2.15.1",
    "cryptography>=50.0.2",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "pydantic>=2.8",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.142.4"]
flask = ["flask>=3.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
iap-portal = "iap_portal.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iap_portal"]
